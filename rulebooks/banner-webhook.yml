# EDA rulebook: when a webhook asks for a banner, run the banner job template
- name: Banner on webhook
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Set banner when asked
      condition: event.payload.action == "set_banner"
      action:
        run_job_template:
          name: Network - Set banner
          organization: Lab
          job_args:
            extra_vars:
              target_site: localhost
              banner_text: "{{ event.payload.banner }}"
